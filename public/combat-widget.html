<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>D&D Combat</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:500px;overflow:hidden;background:#111810;color:#eff4e9;font:16px system-ui}
    main{height:500px;overflow:auto;padding:16px}
    h1{font-size:20px;margin:0 0 8px}
    p{line-height:1.4}
    #error{color:#ffb7ac;white-space:pre-wrap}
    #status{color:#c4d59d}
    #checkpoints{padding-left:22px}
    #checkpoints li{margin:6px 0}
    #fighters li{margin:8px 0}
    small{color:#9aa893}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <h1>D&D Combat</h1>
    <div id="status" role="status">Widget loaded · waiting for MCP bridge…</div>
    <p id="error" role="alert" hidden></p>
    <ol id="checkpoints" aria-label="Startup checkpoints">
      <li>UI parsed</li>
    </ol>
    <p id="summary">Waiting for combat state.</p>
    <ul id="fighters"></ul>
    <p><small>Recovery build · version 5 · MCP handshake only · declarations and graphics temporarily disabled</small></p>
  </main>
  <script>
  (()=>{
    'use strict';
    const $=id=>document.getElementById(id);
    const checkpoints=new Set(['UI parsed']);
    let state=null;

    function showError(value){
      const message=String(value?.message||value||'Unknown error').slice(0,600);
      $('error').hidden=false;
      $('error').textContent=message;
      $('status').textContent='Startup failed';
    }

    function addCheckpoint(label){
      const text=String(label||'').trim();
      if(!text||checkpoints.has(text)) return;
      checkpoints.add(text);
      const li=document.createElement('li');
      li.textContent=text;
      $('checkpoints').append(li);
      $('status').textContent=text;
    }

    function receive(output){
      const next=output?.combatState;
      if(!next||!next.stateRevision||!Array.isArray(next.combatants)) return;
      state=next;
      $('summary').textContent='Round '+state.round+' · '+state.phase+' · revision '+state.stateRevision;
      $('fighters').replaceChildren();
      for(const fighter of state.combatants.filter(item=>item.playerVisible===true)){
        const li=document.createElement('li');
        li.textContent=fighter.name+' · '+fighter.side;
        $('fighters').append(li);
      }
    }

    window.addEventListener('error',event=>showError(event.error||event.message));
    window.addEventListener('unhandledrejection',event=>showError(event.reason));
    window.addEventListener('dnd:error',event=>showError(event.detail));
    window.addEventListener('dnd:checkpoint',event=>addCheckpoint(event.detail));
    window.addEventListener('dnd:result',event=>receive(event.detail));
    window.addEventListener('dnd:connected',()=>addCheckpoint('Bridge connected'));
  })();
  </script>
  <!-- MCP_BRIDGE -->
</body>
</html>
